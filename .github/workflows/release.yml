name: SDK Release

on:
  push:
    branches: [burnout-revenge]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runner: windows-latest
            cc: clang-cl
            cxx: clang-cl
            d3d12: ON
            vulkan: OFF
            out_suffix: win-amd64
          - platform: linux
            runner: ubuntu-latest
            cc: clang-20
            cxx: clang++-20
            d3d12: OFF
            vulkan: ON
            out_suffix: linux-amd64

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: burnout-revenge

      - name: Install deps (Linux)
        if: matrix.platform == 'linux'
        run: |
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 20
          sudo apt-get install -y ninja-build libgtk-3-dev libx11-xcb-dev

      - name: Install deps (Windows)
        if: matrix.platform == 'windows'
        run: choco install llvm cmake ninja -y

      - name: Configure
        shell: bash
        run: |
          cmake -B build \
            -G "Ninja" \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=install \
            -DREXGLUE_USE_D3D12=${{ matrix.d3d12 }} \
            -DREXGLUE_USE_VULKAN=${{ matrix.vulkan }} \
            -DREXGLUE_BUILD_TESTS=OFF

      - name: Build
        run: cmake --build build --parallel ${{ (matrix.platform == 'windows') && 4 || 4 }}

      - name: Install
        run: cmake --install build --config Release

      - name: Package
        shell: bash
        run: |
          VERSION=$(git rev-parse --short HEAD 2>/dev/null || echo "dev")
          NAME="rexglue-sdk-${VERSION}-${{ matrix.out_suffix }}"
          cp -r install "$NAME"
          if [ "${{ matrix.platform }}" = "windows" ]; then
            zip -r "${NAME}.zip" "$NAME"
          else
            tar -czf "${NAME}.tar.gz" "$NAME"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdk-${{ matrix.out_suffix }}
          path: "*.zip"
          if-no-files-found: warn

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: burnout-revenge

      - uses: actions/download-artifact@v4
        with:
          pattern: sdk-*
          path: assets
          merge-multiple: true

      - name: Create tag
        run: |
          TAG="sdk-$(date +%Y%m%d)-${{ github.sha }}"
          echo "SDK_TAG=$TAG" >> $GITHUB_ENV

      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ env.SDK_TAG }}
          tag_name: ${{ env.SDK_TAG }}
          files: assets/*
          prerelease: true
          generate_release_notes: true
